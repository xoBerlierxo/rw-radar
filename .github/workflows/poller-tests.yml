name: poller-tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "poller/**"
      - "registry/**"
      - ".github/workflows/poller-tests.yml"
  schedule:
    - cron: "17 3 * * 1" # weekly (Mon 03:17 UTC): check every ATS endpoint still returns 200
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by SHA
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5, pinned by SHA
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: poller/requirements-lock.txt
      - run: pip install --no-deps -r poller/requirements-lock.txt # exact pins; see the file header
      - name: pytest
        working-directory: poller
        run: python -m pytest -q
      - name: validate-registry (schema, slugs, unique ids)
        working-directory: poller
        run: python -m rwradar_poller validate-registry

  endpoints:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by SHA
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5, pinned by SHA
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: poller/requirements-lock.txt
      - run: pip install --no-deps -r poller/requirements-lock.txt # exact pins; see the file header
      - name: validate-registry --check-endpoints (HTTP 200 from every board)
        working-directory: poller
        env:
          RWRADAR_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python -m rwradar_poller validate-registry --check-endpoints
