# Security and version updates as PRs (review before merging: the poller runs with the Firebase admin key).
version: 2
updates:
  - package-ecosystem: pip
    directory: /poller
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gradle
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
